<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐦 새 OX 퀴즈 — 단체 진행</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --ink:#1f2a37; --ink2:#3a4654;
  --mint:#1D9E75; --mint-d:#0F6E56; --mint-l:#36C794; --mint-soft:#E1F5EE;
  --muted:#6b7280;
  --o-bg:#E1F5EE; --o-border:#0F6E56; --o-text:#0F6E56;
  --x-bg:#FEECEC; --x-border:#C0392B; --x-text:#C0392B;
  --amber:#BA7517;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#0f1419;overflow:hidden;font-family:"Pretendard",sans-serif;-webkit-font-smoothing:antialiased;}

/* ── 뷰포트 & 스테이지 ── */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#stage{width:1280px;height:720px;position:relative;flex:none;transform-origin:center center;border-radius:18px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.55);}

/* ── 화면 공통 ── */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:64px 80px;}
.screen.on{display:flex;}

/* ══════════════════════════════
   홈 화면
══════════════════════════════ */
#home{
  background:linear-gradient(135deg,#0F6E56 0%,#1D9E75 60%,#36C794 100%);
  color:#fff; gap:0;
}
.home-bird{font-size:72px;margin-bottom:12px;}
.home-title{font-size:60px;font-weight:900;letter-spacing:-2px;line-height:1.1;text-align:center;}
.home-sub{font-size:20px;font-weight:500;opacity:.88;margin:12px 0 36px;text-align:center;line-height:1.6;}
.mode-cards{display:flex;gap:28px;}
.mode-card{
  background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35);
  border-radius:22px;padding:32px 40px;text-align:center;cursor:pointer;
  transition:all .2s;min-width:260px;backdrop-filter:blur(4px);
}
.mode-card:hover{background:rgba(255,255,255,.28);transform:translateY(-5px);box-shadow:0 20px 48px rgba(0,0,0,.22);}
.mode-card .mc-icon{font-size:48px;margin-bottom:14px;}
.mode-card .mc-name{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px;}
.mode-card .mc-desc{font-size:15px;opacity:.82;line-height:1.6;}
.home-hint{font-size:13px;opacity:.5;margin-top:24px;text-align:center;}

/* ══════════════════════════════
   공통 슬라이드 레이아웃
══════════════════════════════ */

/* 진행바 */
#progressbar{position:absolute;bottom:0;left:0;height:5px;background:var(--mint-l);transition:width .35s ease;z-index:20;border-radius:0 3px 3px 0;}

/* 페이지 번호 */
.page-indicator{
  position:absolute;top:22px;right:28px;
  font-size:13px;font-weight:700;color:rgba(255,255,255,.55);
  background:rgba(0,0,0,.25);padding:5px 14px;border-radius:999px;
  z-index:20;letter-spacing:.04em;backdrop-filter:blur(4px);
}

/* 레벨 뱃지 */
.lv-badge{
  font-size:13px;font-weight:700;color:#fff;
  padding:5px 14px;border-radius:999px;
  position:absolute;top:22px;left:28px;z-index:20;
}
.lv-badge.lv1{background:#1D9E75;}
.lv-badge.lv2{background:#1976D2;}
.lv-badge.lv3{background:#7B1FA2;}
.lv-badge.random{background:#BA7517;}

/* 키 힌트 */
.key-hint{
  position:absolute;bottom:18px;right:24px;
  font-size:12px;color:rgba(0,0,0,.25);
  display:flex;align-items:center;gap:8px;z-index:20;
}
.key-hint span{background:rgba(0,0,0,.1);padding:3px 10px;border-radius:6px;font-weight:700;}

/* ══════════════════════════════
   문제 슬라이드
══════════════════════════════ */
.q-slide{
  background:
    radial-gradient(1100px 700px at 16% -12%,#eaf9f1 0%,rgba(234,249,241,0) 58%),
    radial-gradient(900px 760px at 112% 120%,#c8ebdc 0%,rgba(200,235,220,0) 55%),
    linear-gradient(135deg,#f4fbf7 0%,#e7f5ee 55%,#d8eee2 100%);
  align-items:flex-start;padding:56px 78px 56px;
}
.q-slide .blob1{position:absolute;width:240px;height:240px;background:#7fcdb2;opacity:.18;border-radius:50%;top:-80px;left:63%;}
.q-slide .blob2{position:absolute;width:120px;height:120px;background:#5dcaa5;opacity:.18;border-radius:50%;bottom:30px;left:-40px;}
.q-num-label{font-size:17px;font-weight:700;color:var(--mint-d);margin-bottom:22px;display:flex;align-items:center;gap:10px;}
.q-num-circle{width:40px;height:40px;border-radius:50%;background:var(--mint);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;}
.q-main-text{font-size:48px;font-weight:800;line-height:1.35;letter-spacing:-1.5px;color:var(--ink);flex:1;display:flex;align-items:center;max-width:1050px;}
.q-deco-num{position:absolute;right:72px;bottom:56px;font-size:200px;font-weight:900;color:var(--mint);opacity:.06;line-height:1;pointer-events:none;user-select:none;}
.ox-hint-row{display:flex;gap:20px;margin-top:auto;padding-top:20px;}
.ox-hint-btn{
  font-size:52px;font-weight:900;width:160px;height:88px;
  border-radius:18px;display:flex;align-items:center;justify-content:center;
  letter-spacing:-2px;pointer-events:none;user-select:none;
}
.ox-hint-btn.o{background:var(--o-bg);color:var(--o-text);border:3px solid var(--o-border);}
.ox-hint-btn.x{background:var(--x-bg);color:var(--x-text);border:3px solid var(--x-border);}
.next-hint{
  display:flex;align-items:center;gap:8px;margin-top:auto;margin-left:auto;padding-top:20px;
  font-size:15px;font-weight:600;color:var(--muted);padding-left:20px;
}
.next-arrow{font-size:22px;animation:pulse .9s ease-in-out infinite alternate;}
@keyframes pulse{from{opacity:.4;transform:translateX(0);}to{opacity:1;transform:translateX(6px);}}

/* ══════════════════════════════
   정답 슬라이드 (O 정답)
══════════════════════════════ */
.ans-slide{align-items:stretch;padding:52px 72px;}
.ans-slide.ans-o-slide{background:linear-gradient(135deg,#e8f9f2 0%,#cff0e5 100%);}
.ans-slide.ans-x-slide{background:linear-gradient(135deg,#fff1f1 0%,#ffe0e0 100%);}
.ans-slide .blob1{position:absolute;width:240px;height:240px;border-radius:50%;top:-80px;left:63%;opacity:.2;}
.ans-slide.ans-o-slide .blob1{background:#1D9E75;}
.ans-slide.ans-x-slide .blob1{background:#C0392B;}
.ans-slide .blob2{position:absolute;width:120px;height:120px;border-radius:50%;bottom:30px;left:-40px;opacity:.2;}
.ans-slide.ans-o-slide .blob2{background:#5dcaa5;}
.ans-slide.ans-x-slide .blob2{background:#e05b5b;}
.ans-header{font-size:15px;font-weight:700;color:var(--ink2);opacity:.65;margin-bottom:10px;}
.ans-body{display:flex;gap:48px;align-items:center;flex:1;}
.ans-big-char{font-size:170px;font-weight:900;line-height:1;letter-spacing:-6px;flex:none;width:230px;text-align:center;}
.ans-o-slide .ans-big-char{color:var(--o-text);}
.ans-x-slide .ans-big-char{color:var(--x-text);}
.ans-right{flex:1;display:flex;flex-direction:column;gap:14px;}
.ans-verdict{font-size:18px;font-weight:800;padding:9px 20px;border-radius:12px;width:fit-content;}
.ans-o-slide .ans-verdict{background:var(--o-bg);color:var(--o-text);}
.ans-x-slide .ans-verdict{background:var(--x-bg);color:var(--x-text);}
.ans-q-echo{font-size:21px;font-weight:700;color:var(--ink2);line-height:1.45;opacity:.7;}
.ans-explain-box{
  font-size:27px;font-weight:700;line-height:1.55;
  padding:22px 28px;border-radius:18px;border-left:7px solid;background:#fff;
}
.ans-o-slide .ans-explain-box{border-color:var(--o-border);color:#0F4A3A;}
.ans-x-slide .ans-explain-box{border-color:var(--x-border);color:#7A1515;}

/* ══════════════════════════════
   레벨 구분 슬라이드
══════════════════════════════ */
.level-divider{color:#fff;gap:18px;text-align:center;}
.level-divider.lv1-bg{background:linear-gradient(135deg,#0F6E56 0%,#1D9E75 100%);}
.level-divider.lv2-bg{background:linear-gradient(135deg,#0D47A1 0%,#1976D2 100%);}
.level-divider.lv3-bg{background:linear-gradient(135deg,#4A148C 0%,#7B1FA2 100%);}
.ld-icon{font-size:60px;}
.ld-eyebrow{font-size:15px;font-weight:700;letter-spacing:.1em;opacity:.8;text-transform:uppercase;}
.ld-title{font-size:56px;font-weight:900;letter-spacing:-1.8px;}
.ld-desc{font-size:20px;opacity:.88;line-height:1.6;max-width:600px;}
.ld-dots{display:flex;gap:12px;}
.ld-dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.6);}

/* ══════════════════════════════
   최종 결과 슬라이드
══════════════════════════════ */
.final-slide{
  background:linear-gradient(135deg,#0F6E56 0%,#1D9E75 100%);
  color:#fff;gap:0;text-align:center;
}
.fs-icon{font-size:72px;margin-bottom:12px;}
.fs-title{font-size:50px;font-weight:900;letter-spacing:-1.8px;margin-bottom:8px;}
.fs-score{font-size:88px;font-weight:900;letter-spacing:-3px;line-height:1;}
.fs-sub{font-size:20px;opacity:.88;line-height:1.6;margin:12px 0 28px;max-width:600px;}
.fs-level-row{display:flex;gap:20px;margin-bottom:32px;}
.fs-lv-card{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);border-radius:18px;padding:20px 28px;text-align:center;min-width:160px;}
.fs-lv-label{font-size:13px;font-weight:700;opacity:.75;letter-spacing:.06em;}
.fs-lv-score{font-size:38px;font-weight:900;letter-spacing:-.8px;}
.fs-lv-name{font-size:13px;opacity:.7;margin-top:2px;}
.fs-replay-btn{
  background:#fff;color:var(--mint-d);
  font-size:20px;font-weight:800;padding:16px 52px;
  border-radius:999px;border:none;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.18);transition:all .15s;
}
.fs-replay-btn:hover{transform:scale(1.04);}

/* ══════════════════════════════
   무한 모드 결과
══════════════════════════════ */
.inf-final{
  background:linear-gradient(135deg,#BA7517 0%,#dd9c2e 100%);
  color:#fff;gap:0;text-align:center;
}
.inf-final .fs-score{font-size:72px;}
</style>
</head>
<body>
<div id="viewport">
<div id="stage">

<!-- 홈 -->
<div class="screen on" id="home">
  <div class="home-bird">🐦</div>
  <div class="home-title">새(조류) OX 퀴즈</div>
  <div class="home-sub">단체 진행용 — 발표자가 슬라이드처럼 넘기며 진행해요<br>PageDown · → · 클릭으로 다음, PageUp · ← · Shift+클릭으로 이전</div>
  <div class="mode-cards">
    <div class="mode-card" onclick="startMode('15')">
      <div class="mc-icon">🎯</div>
      <div class="mc-name">15문제 모드</div>
      <div class="mc-desc">레벨별 5문제씩<br>Easy → Medium → Hard<br>랜덤 출제</div>
    </div>
    <div class="mode-card" onclick="startMode('inf')">
      <div class="mc-icon">♾️</div>
      <div class="mc-name">무한 랜덤 모드</div>
      <div class="mc-desc">난이도 관계없이<br>계속 랜덤 출제<br>원하는 때 종료</div>
    </div>
  </div>
  <div class="home-hint">F키 : 전체화면 토글</div>
</div>

<!-- 슬라이드 컨테이너 -->
<div id="slide-container" style="display:none;position:absolute;inset:0;">
  <!-- JS로 슬라이드 동적 생성 -->
  <div id="progressbar"></div>
</div>

</div><!-- #stage -->
</div><!-- #viewport -->

<script>
// ══════════════════════════════════════════════
// 문제 데이터
// ══════════════════════════════════════════════
const ALL_Q = [
  // EASY (15문제)
  {t:"딱새는 꼬리를 까딱까딱 움직이는 버릇이 있다.",a:true,e:"딱새는 앉아 있을 때도 꼬리를 위아래로 까딱거리는 귀여운 버릇이 있어요!",d:"easy"},
  {t:"청둥오리 수컷은 번식기에 머리가 초록빛으로 반짝인다.",a:true,e:"청둥오리 수컷은 짝짓기 계절에 머리가 금속처럼 반짝이는 초록색으로 변해요!",d:"easy"},
  {t:"소쩍새는 밤에 활동하는 야행성 부엉이의 일종이다.",a:true,e:"소쩍새는 밤에 '소쩍 소쩍' 우는 작은 부엉이로, 숲의 밤을 지켜주는 새예요!",d:"easy"},
  {t:"수리부엉이는 우리나라 생태계의 최상위 포식자 중 하나다.",a:true,e:"수리부엉이는 밤의 제왕으로, 쥐와 토끼까지 사냥하는 강력한 천적이에요!",d:"easy"},
  {t:"까마귀는 도구를 사용할 정도로 지능이 높다.",a:true,e:"까마귀는 나뭇가지로 먹이를 꺼내거나 자동차 바퀴로 호두를 까는 도구를 쓸 줄 알아요!",d:"easy"},
  {t:"펭귄은 북극에 산다.",a:false,e:"펭귄은 남극과 남반구에만 살아요. 북극에는 펭귄이 없고 대신 북극곰이 살아요!",d:"easy"},
  {t:"박쥐는 새의 일종이다.",a:false,e:"박쥐는 날개가 있지만 새가 아니라 새끼를 낳고 젖을 먹이는 포유동물이에요!",d:"easy"},
  {t:"새의 뼈는 하늘을 날기 위해 속이 비어 있어 가볍다.",a:true,e:"새의 뼈 속은 공기로 가득 차 있어서 몸을 가볍게 해 하늘을 날 수 있게 해줘요!",d:"easy"},
  {t:"새는 땀샘이 없어서 땀을 흘리지 않는다.",a:true,e:"새는 땀샘이 없어서 더울 때 입을 벌리고 헐떡거리거나 물을 마셔서 체온을 낮춰요!",d:"easy"},
  {t:"새는 잠잘 때 한 발로 서서 자기도 한다.",a:true,e:"새들은 다리 하나를 따뜻한 깃털 속에 넣고 한 발로 서서 자면 체온을 더 잘 지킬 수 있어요!",d:"easy"},
  {t:"조류의 조상은 공룡이라는 학설이 지배적이다.",a:true,e:"오늘날의 새는 깃털을 가진 공룡에서 진화했어요. 새는 살아있는 공룡의 후손인 셈이에요!",d:"easy"},
  {t:"모든 새는 이빨이 있다.",a:false,e:"새는 이빨이 없고 대신 딱딱한 부리로 먹이를 쪼거나 삼켜요!",d:"easy"},
  {t:"황새는 목소리가 아름다워 '노래하는 새'라고 불린다.",a:false,e:"황새는 울음소리를 거의 못 내고, 대신 부리를 딸깍딸깍 부딪혀 소리를 낸답니다!",d:"easy"},
  {t:"홍학의 분홍색은 먹이인 새우나 조류의 색소에서 온다.",a:true,e:"홍학은 새우와 조류 속 분홍 색소를 먹어서 몸이 분홍색이 되는 거예요!",d:"easy"},
  {t:"새는 귀가 깃털에 덮여 있어 보이지 않지만 존재한다.",a:true,e:"새의 귀는 깃털로 덮여서 보이지 않지만 소리를 잘 들을 수 있는 발달된 청각 기관이 있어요!",d:"easy"},

  // MEDIUM (15문제)
  {t:"세가락도요는 파도가 밀려올 때 파도를 향해 달려간다.",a:false,e:"세가락도요는 파도가 오면 재빠르게 도망치면서 물가에 드러나는 먹이를 잡아먹어요!",d:"medium"},
  {t:"긴꼬리딱새는 암컷의 꼬리가 수컷보다 훨씬 길다.",a:false,e:"수컷의 꼬리가 엄청나게 길어서 이름도 '긴꼬리딱새'가 된 거예요!",d:"medium"},
  {t:"개개비는 뻐꾸기가 몰래 낳아 놓은 알을 자기 알인 줄 알고 키운다.",a:true,e:"뻐꾸기가 남의 둥지에 알을 몰래 낳는 '탁란' 전략에 개개비가 자주 속아요!",d:"medium"},
  {t:"물총새는 붉은색 등과 파란색 배를 가지고 있다.",a:false,e:"물총새는 반대로 반짝이는 파란 등과 주황색 배를 가진 아름다운 새예요!",d:"medium"},
  {t:"동고비는 나무 기둥을 거꾸로 타고 내려올 수 있다.",a:true,e:"동고비는 우리나라 새 중 거의 유일하게 나무를 머리 아래로 하고 거꾸로 내려올 수 있어요!",d:"medium"},
  {t:"어치는 땅에 묻어 둔 도토리의 위치를 모두 정확히 기억한다.",a:false,e:"어치는 잘 까먹어서 찾지 못한 도토리가 싹을 틔우는 덕분에 숲이 넓어진답니다!",d:"medium"},
  {t:"딱따구리는 나무를 쪼아도 뇌진탕에 걸리지 않는다.",a:true,e:"딱따구리의 머리뼈는 스펀지처럼 충격을 흡수하는 특수 구조로 되어 있어서 나무를 쪼아도 안전해요!",d:"medium"},
  {t:"부엉이와 올빼미는 목을 270도까지 돌릴 수 있다.",a:true,e:"부엉이는 눈이 고정되어 있어서 대신 목을 좌우로 270도나 돌려 사방을 둘러볼 수 있어요!",d:"medium"},
  {t:"벌새는 공중에 멈춰서 날개만 움직이는 호버링 비행을 할 수 있다.",a:true,e:"벌새는 1초에 수십 번 날개를 퍼덕여 꽃 앞에 공중에서 멈춰 꿀을 빨아먹는 특별한 새예요!",d:"medium"},
  {t:"까치는 거울 속에 비친 자기 모습을 알아볼 수 있다.",a:true,e:"까치는 거울에서 자기 모습을 보고 '나다!'하고 알아차리는 자아 인식 능력을 가진 똑똑한 새예요!",d:"medium"},

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pick(diff,n){return shuffle(ALL_Q.filter(q=>q.d===diff)).slice(0,n);}

// ══════════════════════════════════════════════
// 모드 시작
// ══════════════════════════════════════════════
function startMode(m){
  mode = m;
  cur = 0;
  const container = document.getElementById('slide-container');
  container.innerHTML = '<div id="progressbar"></div>';
  slides = [];

  if(m === '15'){
    // 구분 슬라이드 + 문제/정답 쌍 × 3레벨
    const diffs = ['easy','medium','hard'];
    diffs.forEach(diff => {
      const qs = pick(diff, 5);
      const meta = LEVEL_META[diff];
      const divider = makeDividerSlide(diff, 0, 0);
      container.appendChild(divider);
      slides.push(divider);

      qs.forEach((q, i) => {
        const qSlide = makeQSlide(q, i+1, 5, meta);
        const aSlide = makeAnsSlide(q, i+1, 5, meta);
        container.appendChild(qSlide);
        container.appendChild(aSlide);
        slides.push(qSlide);
        slides.push(aSlide);
      });
    });
    // 최종 결과
    const fin = makeFinalSlide15();
    container.appendChild(fin);
    slides.push(fin);

  } else {
    // 무한 모드 — 전체 풀 섞어서 준비, 처음 1쌍만 삽입
    infPool = shuffle(ALL_Q);
    infIdx = 0;
    infCount = 0;
    appendInfPair();
  }

  container.style.display = 'block';
  document.getElementById('home').classList.remove('on');
  goTo(0);
}

function appendInfPair(){
  const container = document.getElementById('slide-container');
  // 풀 소진 시 다시 섞기
  if(infIdx >= infPool.length){
    infPool = shuffle(ALL_Q);
    infIdx = 0;
  }
  const q = infPool[infIdx++];
  infCount++;
  const qS = makeInfQSlide(q, infCount);
  const aS = makeInfAnsSlide(q, infCount);
  container.appendChild(qS);
  container.appendChild(aS);
  slides.push(qS);
  slides.push(aS);
  updateProgress();
}

function endInfMode(){
  const container = document.getElementById('slide-container');
  const fin = document.createElement('div');
  fin.className = 'screen inf-final';
  fin.innerHTML = `
    <div class="fs-icon">♾️</div>
    <div class="fs-title">무한 모드 종료!</div>
    <div class="fs-score">${infCount}문제 완주!</div>
    <div class="fs-sub">${infCount}개의 새 이야기를 함께 만났어요.<br>새 세계는 정말 넓고 놀라워요!</div>
    <button class="fs-replay-btn" style="background:#fff;color:#BA7517;" onclick="goHome()">처음으로 🔄</button>
  `;
  container.appendChild(fin);
  slides.push(fin);
  goTo(slides.length - 1);
}

// ══════════════════════════════════════════════
// 슬라이드 이동
// ══════════════════════════════════════════════
function goTo(n){
  if(n < 0 || n >= slides.length) return;
  slides.forEach(s => s.classList.remove('on'));
  cur = n;
  slides[cur].classList.add('on');
  updateProgress();

  // 무한모드: 정답 슬라이드 보여줄 때 다음 쌍 미리 추가
  if(mode === 'inf' && slides[cur].dataset.infAns){
    // 마지막 2개 (현재 쌍)이면 다음 쌍 준비
    if(cur >= slides.length - 2){
      appendInfPair();
    }
  }
}

function updateProgress(){
  const pb = document.getElementById('progressbar');
  if(!pb) return;
  const total = slides.length;
  pb.style.width = total <= 1 ? '0%' : ((cur / (total-1)) * 100) + '%';
}

function next(){goTo(cur+1);}
function prev(){goTo(cur-1);}

function goHome(){
  const container = document.getElementById('slide-container');
  container.style.display = 'none';
  container.innerHTML = '<div id="progressbar"></div>';
  slides = [];
  cur = 0;
  mode = '';
  document.getElementById('home').classList.add('on');
}

// ── 키보드 ──
document.addEventListener('keydown', e => {
  if(document.getElementById('home').classList.contains('on')){
    if(e.key==='1') startMode('15');
    if(e.key==='2') startMode('inf');
    return;
  }
  const fwd = ['ArrowRight','PageDown',' ','Enter'];
  const bwd = ['ArrowLeft','PageUp'];
  if(fwd.includes(e.key)){e.preventDefault();next();}
  if(bwd.includes(e.key)){e.preventDefault();prev();}
  if(e.key==='Escape'||e.key==='Home') goHome();
  if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

document.getElementById('stage').addEventListener('touchstart', e=>{touchStartX=e.touches[0].clientX;},{passive:true});
document.getElementById('stage').addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx)>40){ dx<0?next():prev(); }
},{passive:true});
document.getElementById('stage').addEventListener('click', e=>{
  // 버튼 클릭은 제외
  if(e.target.tagName==='BUTTON') return;
  e.shiftKey ? prev() : next();
});

// ── 스케일 ──
function scale(){
  const s=Math.min(window.innerWidth/1280,window.innerHeight/720);
  document.getElementById('stage').style.transform=`scale(${s})`;
}
window.addEventListener('resize',scale);
scale();
</script>
</body>
</html>
